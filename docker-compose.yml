services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: company
      POSTGRES_USER: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company"]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: .
      secrets:
        - proxy_ca
    environment: &app_environment
      POSTGRES_USER: company
      POSTGRES_DB: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      PGHOST: postgres
      MOCK_MODE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  worker:
    restart: unless-stopped
    build:
      context: .
      secrets:
        - proxy_ca
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - company_reports:/app/reports
volumes:
  postgres_data:
  company_reports:
secrets:
  proxy_ca:
    file: ${BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
