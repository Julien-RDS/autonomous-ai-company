name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: company
          POSTGRES_DB: company_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U company -d company_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate installed dependencies and Python syntax
        run: |
          python -m pip check
          python -m compileall -q company tests
      - name: Prepare sandbox test image (no secret, explicit pull)
        # Test fixture image only. The tests resolve and record its immutable ID.
        # Production allowlists an image by ID via SANDBOX_PYTHON_IMAGE_ID.
        run: |
          docker pull python:3.12-slim
          docker image inspect --format '{{.Id}}' python:3.12-slim
      - name: Test offline simulation
        env:
          MOCK_MODE: 'true'
          TEST_DATABASE_URL: postgresql+psycopg://company:ci-ephemeral-only@127.0.0.1:5432/company_test
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          TEST_SANDBOX_IMAGE: python:3.12-slim
        run: python -m pytest -q -rs
