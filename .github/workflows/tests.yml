name: Tests
on:
  push:
    branches: [main, dev, feat/lot-3-sandbox, feat/sandbox-results-recovery, fix/ci-cgroup-diagnostics]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Digest verified against registry metadata on 2026-11-09; override explicitly.
      SANDBOX_TEST_IMAGE: ${{ vars.SANDBOX_TEST_IMAGE || 'python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: company
          POSTGRES_DB: company_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U company -d company_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate installed dependencies and Python syntax
        run: |
          python -m pip check
          python -m compileall -q company tests
      - name: Prepare sandbox test image (no secret, explicit pull)
        # Test fixture image only. The tests resolve and record its immutable ID.
        # Production allowlists an image by ID via SANDBOX_PYTHON_IMAGE_ID.
        run: |
          docker pull "$SANDBOX_TEST_IMAGE"
          docker image inspect --format '{{.Id}}' "$SANDBOX_TEST_IMAGE"
      - name: Sandbox diagnostics (informational, no prototype code)
        # Declared capabilities and kernel cgroup values seen inside a probe container.
        # Never fails the job by itself; the tests below decide.
        env:
          MOCK_MODE: 'true'
          DATABASE_URL: sqlite:////tmp/sandbox-diagnostics.db
        run: |
          docker info --format 'cgroup v{{.CgroupVersion}} driver={{.CgroupDriver}} mem={{.MemoryLimit}} swap={{.SwapLimit}} pids={{.PidsLimit}} cfs={{.CPUCfsQuota}}' || true
          python -m company sandbox probe --image-id "$(docker image inspect --format '{{.Id}}' "$SANDBOX_TEST_IMAGE")" || true
      - name: Test offline simulation
        env:
          MOCK_MODE: 'true'
          TEST_DATABASE_URL: postgresql+psycopg://company:ci-ephemeral-only@127.0.0.1:5432/company_test
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          TEST_SANDBOX_IMAGE: ${{ env.SANDBOX_TEST_IMAGE }}
        run: python -m pytest -q -rfEs --tb=short
